# Isolated PostgreSQL 16 for Arsenkin DB readiness / lifecycle acceptance.
# Never points at production. Separate port, DB, user, volume.
#
#   docker compose -f docker-compose.arsenkin-test.yml up -d
#   docker compose -f docker-compose.arsenkin-test.yml down -v

services:
  arsenkin-test-pg:
    image: postgres:16-alpine
    container_name: arsenkin-test-pg
    environment:
      POSTGRES_USER: arsenkin_test
      POSTGRES_PASSWORD: arsenkin_test_pw
      POSTGRES_DB: arsenkin_test
    ports:
      - "55432:5432"
    volumes:
      - arsenkin_test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsenkin_test -d arsenkin_test"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  arsenkin_test_pg_data:
