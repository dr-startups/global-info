# Production-like Docker Compose for the Digital Profile Audit module (Stage M3).
#
# Services: Postgres + Python renderer + Next.js app. All configuration comes
# from .env.production (copy .env.production.example -> .env.production and fill
# in real secrets). NEVER commit .env.production.
#
# Usage:
#   cp .env.production.example .env.production   # then edit secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app npm run db:deploy
#   docker compose -f docker-compose.prod.yml exec app npm run admin:create   # or db:seed:demo
#   curl http://localhost:3000/api/digital-profile/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: dp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-global_info}
    volumes:
      - dp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-global_info}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  renderer:
    build:
      context: ./renderer
    image: global-info-renderer
    container_name: dp-renderer
    init: true
    tmpfs:
      - /tmp
    volumes:
      # READ-ONLY input base only (e.g. screenshots for embedding). The renderer
      # is stateless: it renders to a temp dir and returns bytes over HTTP — it
      # never writes outputs here. On Railway it has no volume at all.
      - dp_storage:/data:ro
    environment:
      DATA_ROOT: /data
      # Docker bridge is IPv4-only; bind 0.0.0.0 here (Railway uses the :: default).
      RENDERER_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: global-info-app
    container_name: dp-app
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Container-network defaults (override in .env.production if needed).
      RENDERER_URL: ${RENDERER_URL:-http://renderer:8080}
      DIGITAL_PROFILE_STORAGE_ROOT: ${DIGITAL_PROFILE_STORAGE_ROOT:-/app/storage/digital-profile}
    volumes:
      # Same private storage volume the renderer writes to, at the app's root.
      - dp_storage:/app/storage/digital-profile
    ports:
      # Host port is configurable (APP_PORT) so the stack can coexist with a
      # local dev server on 3000. Container always listens on 3000.
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:3000/api/digital-profile/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  dp_pgdata:
  dp_storage:
