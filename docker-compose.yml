# Local infrastructure for the Digital Profile module.
#
# Only the report renderer is defined here. PostgreSQL is run separately (see
# README) to avoid clashing with an already-running container on port 5432.
#
# Usage:
#   docker compose up -d --build renderer
#   curl http://localhost:8080/health

services:
  renderer:
    build:
      # Repo-root context so renderer/Dockerfile matches the Railway build.
      context: .
      dockerfile: renderer/Dockerfile
    image: global-info-renderer
    container_name: global-info-renderer
    # Proper PID 1 / signal handling so LibreOffice children are reaped.
    init: true
    ports:
      - "8080:8080"
    volumes:
      # Shared PRIVATE storage: Node writes report_json/screenshots, the renderer
      # writes pptx/pdf, both via the same storage keys. Never expose publicly.
      - ./storage/digital-profile:/data
    # Scratch space for LibreOffice profiles/temp; wiped on restart.
    tmpfs:
      - /tmp
    environment:
      DATA_ROOT: /data
      # Docker bridge is IPv4-only; bind 0.0.0.0 (the image defaults to :: for Railway).
      RENDERER_HOST: "0.0.0.0"
    # No secrets are needed by the renderer; do not add credentials here.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
